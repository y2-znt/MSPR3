name: Generate Changelog

on:
  push:
    branches: [changelog-ci]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: changelog-ci
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install conventional-changelog
        run: npm install -g conventional-changelog-cli

      - name: Configure Git
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

      - name: Generate Changelog
        run: |
          rm -f CHANGELOG.md
          conventional-changelog -p angular -o CHANGELOG.md -r 0 --commit-path="origin/main"
          
          # DEBUG - Voir ce qu'on a généré
          echo "=== CONTENU BRUT ==="
          head -20 CHANGELOG.md
          
          # SCRIPT AWK CORRIGÉ
          grep "^\* " CHANGELOG.md | head -30 | \
          awk '
          BEGIN { count = 0 }
          {
            # Extraire le message après les deux points
            if (match($0, /\* (.+) \([a-f0-9]+\)/, arr)) {
              full_msg = arr[1]
              # Si il y a des deux points, prendre après
              if (index(full_msg, ":") > 0) {
                clean_msg = substr(full_msg, index(full_msg, ":") + 1)
                gsub(/^[ \t]+/, "", clean_msg)  # trim début
              } else {
                clean_msg = full_msg
              }
              
              if (!seen[clean_msg]++ && count < 30) {
                print $0
                count++
              }
            }
          }' > commits.tmp
          
          # DEBUG - Voir les commits extraits
          echo "=== COMMITS EXTRAITS ==="
          wc -l commits.tmp
          head -10 commits.tmp
          
          # Reconstituer le changelog
          echo "# Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "All notable changes to this project will be documented in this file." >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## $(date +%Y-%m-%d)" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          
          # Features
          echo "### Features" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          grep "^\* feat\|^\* add\|^\* implement\|^\* create" commits.tmp >> CHANGELOG.md || echo "Aucune feature trouvée"
          echo "" >> CHANGELOG.md
          
          # Bug Fixes  
          echo "### Bug Fixes" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          grep "^\* fix\|^\* correct\|^\* update\|^\* remove" commits.tmp >> CHANGELOG.md || echo "Aucun bug fix trouvé"
          echo "" >> CHANGELOG.md
          
          # Other Changes
          echo "### Other Changes" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          grep -v "^\* feat\|^\* add\|^\* implement\|^\* create\|^\* fix\|^\* correct\|^\* update\|^\* remove" commits.tmp >> CHANGELOG.md || echo "Aucun autre changement"
          
          # Nettoyer
          rm -f commits.tmp

      - name: Commit and Push
        run: |
          git add CHANGELOG.md
          git diff --staged --quiet || (git commit -m "docs: update changelog" && git push)