name: Generate Changelog

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install conventional-changelog
        run: npm install -g conventional-changelog-cli

      - name: Configure Git
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

      - name: Generate Changelog
        run: |
          rm -f CHANGELOG.md
          conventional-changelog -p angular -o CHANGELOG.md -r 0
          
          grep "^#\|^###" CHANGELOG.md > headers.tmp
          
          grep "^\* " CHANGELOG.md | \
          awk '{
            if (match($0, /\* [^:]*:(.+) \([a-f0-9]+\)/, arr)) {
              msg = arr[1]
              gsub(/^[ \t]+|[ \t]+$/, "", msg)
            } else {
              msg = $0
            }
            if (!seen[msg]++ && count < 30) {
              print $0
              count++
            }
          }' > commits.tmp
          
          echo "# Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "All notable changes to this project will be documented in this file." >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## $(date +%Y-%m-%d)" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          
          echo "### Features" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          grep "^\* feat\|^\* add\|^\* implement\|^\* create" commits.tmp >> CHANGELOG.md || true
          echo "" >> CHANGELOG.md
          
          echo "### Bug Fixes" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          grep "^\* fix\|^\* correct\|^\* update\|^\* remove" commits.tmp >> CHANGELOG.md || true
          
          rm -f headers.tmp commits.tmp


      - name: Commit and Push
        run: |
          git add CHANGELOG.md
          git diff --staged --quiet || (git commit -m "docs: update changelog" && git push)