name: Generate Changelog

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install conventional-changelog
        run: npm install -g conventional-changelog-cli

      - name: Configure Git
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

      - name: Generate Changelog
        run: |
          rm -f CHANGELOG.md
          conventional-changelog -p angular -o CHANGELOG.md -r 0
          
          # Version AWK corrigée pour garder les préfixes
          awk '
          /^\* / {
              # Extraire le message après le préfixe pour la déduplication
              match($0, /\* ([^:]+:)(.+) \([a-f0-9]+\)/, arr)
              if (arr[2]) {
                  clean_msg = arr[2]
                  gsub(/^[ \t]+|[ \t]+$/, "", clean_msg)  # trim
                  if (!seen[clean_msg]++ && count < 30) {
                      print $0
                      count++
                  }
              } else if (count < 30) {
                  print $0
                  count++
              }
          }
          !/^\* / { print $0 }
          ' CHANGELOG.md > temp.md && mv temp.md CHANGELOG.md





      - name: Commit and Push
        run: |
          git add CHANGELOG.md
          git diff --staged --quiet || (git commit -m "docs: update changelog" && git push)