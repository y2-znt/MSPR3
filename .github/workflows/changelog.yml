name: Generate Changelog

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install conventional-changelog
        run: npm install -g conventional-changelog-cli

      - name: Configure Git
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

      - name: Generate Changelog
        run: |
          rm -f CHANGELOG.md
          conventional-changelog -p angular -o CHANGELOG.md -r 0
          
          # SOLUTION ULTIME - Traiter APRÈS que conventional-changelog ait créé les catégories
          python3 << 'EOF'
          import re
          
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          
          # Séparer par sections (Features, Bug Fixes, etc.)
          sections = re.split(r'(### .+?\n)', content)
          
          result = []
          seen_messages = set()
          total_commits = 0
          max_commits = 30
          
          for i, section in enumerate(sections):
              if section.startswith('### '):
                  # C'est un header de section
                  result.append(section)
              elif section.strip():
                  # C'est le contenu d'une section
                  lines = section.split('\n')
                  section_result = []
                  
                  for line in lines:
                      if line.startswith('* ') and total_commits < max_commits:
                          # Extraire le message après le préfixe
                          match = re.search(r'\* (?:[^:]+:\s*)?(.+?)\s*\([a-f0-9]+\)', line)
                          if match:
                              message = match.group(1).strip()
                              if message not in seen_messages:
                                  seen_messages.add(message)
                                  section_result.append(line)
                                  total_commits += 1
                      elif not line.startswith('* '):
                          section_result.append(line)
                  
                  result.append('\n'.join(section_result))
              else:
                  result.append(section)
          
          with open('CHANGELOG.md', 'w') as f:
              f.write(''.join(result))
          EOF

      - name: Commit and Push
        run: |
          git add CHANGELOG.md
          git diff --staged --quiet || (git commit -m "docs: update changelog" && git push)