name: Generate Changelog

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install conventional-changelog
        run: npm install -g conventional-changelog-cli

      - name: Configure Git
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

      - name: Generate Changelog
        run: |
          rm -f CHANGELOG.md
          conventional-changelog -p angular -o CHANGELOG.md -r 0
          
          # Version BACKUP - Simple et efficace
          grep "^\* " CHANGELOG.md | awk '!seen[substr($0, 3, index(substr($0, 3), " (") - 1)]++' | head -30 > commits.tmp
          grep -v "^\* " CHANGELOG.md > headers.tmp
          cat headers.tmp commits.tmp > CHANGELOG.md
          rm commits.tmp headers.tmp



      - name: Commit and Push
        run: |
          git add CHANGELOG.md
          git diff --staged --quiet || (git commit -m "docs: update changelog" && git push)