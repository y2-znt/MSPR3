name: Generate Changelog

on:
  push:
    branches: [changelog-ci]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: changelog-ci
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install conventional-changelog
        run: npm install -g conventional-changelog-cli

      - name: Configure Git
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

      - name: Generate Changelog
        run: |
          rm -f CHANGELOG.md

          git log origin/main --oneline --pretty=format:"%s" --no-merges | head -50 > raw_commits.txt

          echo "=== COMMITS BRUTS DE MAIN ==="
          head -10 raw_commits.txt

          cat raw_commits.txt | \
          awk '
          BEGIN { count = 0 }
          {
            msg = $0
            if (index(msg, ":") > 0) {
              clean_msg = substr(msg, index(msg, ":") + 1)
            } else {
              clean_msg = msg
            }
            
            if (!seen[clean_msg]++ && count < 30) {
              print "* " msg " ([commit](https://github.com/y2-znt/MSPR3/commit/hash))"
              count++
            }
          }' > commits.tmp

          echo "=== COMMITS FORMATÉS ==="
          wc -l commits.tmp
          head -10 commits.tmp

          echo "# Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "All notable changes to this project will be documented in this file." >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## $(date +%Y-%m-%d)" >> CHANGELOG.md
          echo "" >> CHANGELOG.md

          echo "### Features" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          grep "^\* feat\|^\* add\|^\* implement\|^\* create" commits.tmp >> CHANGELOG.md || echo "Aucune feature trouvée"
          echo "" >> CHANGELOG.md

          echo "### Bug Fixes" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          grep "^\* fix\|^\* correct\|^\* update\|^\* remove" commits.tmp >> CHANGELOG.md || echo "Aucun bug fix trouvé"
          echo "" >> CHANGELOG.md

          echo "### Other Changes" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          grep -v "^\* feat\|^\* add\|^\* implement\|^\* create\|^\* fix\|^\* correct\|^\* update\|^\* remove" commits.tmp >> CHANGELOG.md || echo "Aucun autre changement"

          rm -f commits.tmp raw_commits.txt

      - name: Commit and Push
        run: |
          git add CHANGELOG.md
          git diff --staged --quiet || (git commit -m "docs: update changelog" && git push)
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install -g conventional-changelog-cli
          npm install -g standard-version

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Get Previous Tag
        id: previous-tag
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "previous-tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREVIOUS_TAG"

      - name: Debug Git History
        run: |
          echo "=== Derniers commits ==="
          git log --oneline -10
          echo "=== Commits avec feat/fix ==="
          git log --oneline --grep="^feat" --grep="^fix" --all-match -10 || echo "Aucun commit feat/fix trouvé"
          echo "=== Structure des commits ==="
          git log --pretty=format:"%h - %s" -5

      - name: Generate Changelog
        run: |
          echo "Génération du changelog..."
          if [ ! -f "CHANGELOG.md" ]; then
            echo "Création du fichier CHANGELOG.md initial"
            touch CHANGELOG.md
          fi

          if [ -z "${{ steps.previous-tag.outputs.previous-tag }}" ]; then
            echo "Génération du changelog initial..."
            conventional-changelog -p angular -i CHANGELOG.md -s -r 0 || echo "Erreur lors de la génération"
          else
            echo "Mise à jour du changelog depuis ${{ steps.previous-tag.outputs.previous-tag }}..."
            conventional-changelog -p angular -i CHANGELOG.md -s || echo "Erreur lors de la mise à jour"
          fi

          echo "Contenu généré:"
          cat CHANGELOG.md | head -20

      - name: Check for Changes
        id: changes
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "Aucun changement détecté dans le changelog"
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "Changements détectés dans le changelog"
          fi

      - name: Update README Badge
        if: steps.changes.outputs.has-changes == 'true'
        run: |
          CURRENT_DATE=$(date +'%Y-%m-%d')
          if [ -f "README.md" ]; then
            if grep -q "Dernière mise à jour" README.md; then
              sed -i "s/Dernière mise à jour-[0-9]*-[0-9]*-[0-9]*/Dernière mise à jour-${CURRENT_DATE}/g" README.md
            else
              echo -e "\n![Dernière mise à jour](https://img.shields.io/badge/Dernière%20mise%20à%20jour-${CURRENT_DATE}-blue?style=for-the-badge)" >> README.md
            fi
          fi

      - name: Commit Changes
        if: steps.changes.outputs.has-changes == 'true'
        run: |
          git add CHANGELOG.md
          if [ -f "README.md" ]; then
            git add README.md
          fi
          git commit -m "docs: mise à jour automatique du changelog [skip-changelog]"
          git push origin main

      - name: Create Release
        if: steps.changes.outputs.has-changes == 'true' && github.event.inputs.version != ''
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
