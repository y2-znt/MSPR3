name: Generate Changelog

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install conventional-changelog
        run: npm install -g conventional-changelog-cli

      - name: Configure Git
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

      - name: Generate Changelog
        run: |
          rm -f CHANGELOG.md
          
          # Générer un changelog avec BEAUCOUP plus de commits pour avoir du choix
          conventional-changelog -p angular -o CHANGELOG.md -r 0 --commit-count=200
          
          # Script Python ULTRA PUISSANT pour garder 30 commits uniques
          python3 << 'EOF'
          import re
          
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          
          lines = content.split('\n')
          seen_messages = set()
          result = []
          commit_count = 0
          max_commits = 30
          
          for line in lines:
              if line.startswith('* ') and commit_count < max_commits:
                  # Extraire le message du commit
                  message_match = re.search(r'\* (.+?) \([a-f0-9]+\)', line)
                  if message_match:
                      message = message_match.group(1).strip()
                      if message not in seen_messages:
                          seen_messages.add(message)
                          result.append(line)
                          commit_count += 1
                  else:
                      if commit_count < max_commits:
                          result.append(line)
                          commit_count += 1
              elif not line.startswith('* '):
                  # Garder les headers, dates, etc.
                  result.append(line)
          
          with open('CHANGELOG.md', 'w') as f:
              f.write('\n'.join(result))
          EOF


      - name: Commit and Push
        run: |
          git add CHANGELOG.md
          git diff --staged --quiet || (git commit -m "docs: update changelog" && git push)